name: Publish Docker Image to ACR

on:
  workflow_call:
    inputs:
      docker_image:
        type: string
        description: 'Docker image name with tag for publishing'
        required: true
      image_tag:
        type: string
        description: 'Image tag for the Docker image'
        required: true
      acr_repository:
        type: string
        description: 'ACR repository for publishing (e.g. myregistry.azurecr.io)'
        required: false
      artifact_name:
        type: string
        description: 'Name of the artifact containing the Docker image'
        required: false
        default: 'docker-image'
      azure_client_id:
        type: string
        description: 'Client ID of the Azure AD App Registration federated for OIDC login'
        required: false
      azure_tenant_id:
        type: string
        description: 'Azure AD tenant ID that owns the ACR'
        required: false
      azure_subscription_id:
        type: string
        description: 'Azure subscription ID that owns the ACR'
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}

      - name: Load Docker Image
        run: docker load -i "$(basename "${{ inputs.docker_image }}").tar"

      - name: Azure login (OIDC)
        if: ${{ inputs.acr_repository }}
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Login to ACR
        if: ${{ inputs.acr_repository }}
        run: |
          az acr login --name "${ACR_REPOSITORY%%.*}"
        env:
          ACR_REPOSITORY: ${{ inputs.acr_repository }}

      - name: Push Docker Image to ACR
        if: ${{ inputs.acr_repository }}
        run: |
          docker tag ${{ inputs.docker_image }}:${{ inputs.image_tag }} ${{ inputs.acr_repository }}/${{ inputs.docker_image }}:${{ inputs.image_tag }}
          docker push ${{ inputs.acr_repository }}/${{ inputs.docker_image }}:${{ inputs.image_tag }}
